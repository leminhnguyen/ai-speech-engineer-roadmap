name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Check SOTA tracker is in sync with its data
        run: make sota-check
      - run: make audit
      - run: make test
      - run: make figures
      - run: make notebooks
