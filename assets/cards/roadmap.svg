<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 250" width="320" height="250" role="img" aria-labelledby="title desc">
  <title id="title">Roadmap</title>
  <desc id="desc">Pillar 01, Roadmap: a small snail walks a dashed path through four milestones, Basics, Tools, Core and SOTA. What to learn, in order.</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f5d75"/></marker></defs>
  <style>
    .tag { font-family: 'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-weight: 500; letter-spacing: .08em; }
    .h { font-family: Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; font-weight: 600; fill: #2d3142; }
    .s { font-family: Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; fill: #4f5d75; }
    .c { font-family: 'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
    .serif { font-family: 'Instrument Serif',Georgia,'Times New Roman',serif; font-style: italic; fill: #4f5d75; }
    .flow { stroke-dasharray: 2 5; stroke-linecap: round; animation: flow .9s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -14; } }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    .bob { animation: bob 2.4s ease-in-out infinite; }
    @keyframes bob { 0%,100% { transform: translate(0,0); } 50% { transform: translate(0,-3px); } }
    .bar { transform-box: fill-box; transform-origin: 50% 100%; animation: bar .9s ease-in-out infinite; }
    @keyframes bar { 0%,100% { transform: scaleY(.35); } 50% { transform: scaleY(1); } }
    .blink { transform-box: fill-box; transform-origin: center; animation: blink 4s infinite; }
    @keyframes blink { 0%,93%,100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
