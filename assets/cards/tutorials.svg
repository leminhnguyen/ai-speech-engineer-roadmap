<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220" role="img" aria-labelledby="title desc">
  <title id="title">Tutorials</title>
  <desc id="desc">A sine waveform scrolls across the card while spectrum bars rise and fall beneath it.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#062e2a"/>
      <stop offset="1" stop-color="#117a65"/>
    </linearGradient>
    <linearGradient id="barfill" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2ee6a8"/>
      <stop offset="1" stop-color="#c8ff7a"/>
    </linearGradient>
    <clipPath id="waveclip"><rect x="24" y="100" width="272" height="56"/></clipPath>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.12" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.88" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="wavemask"><rect x="24" y="100" width="272" height="56" fill="url(#fade)"/></mask>
  </defs>
  <style>
    .font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .eyebrow { font-size: 10px; font-weight: 700; letter-spacing: 2px; fill: #2ee6a8; }
    .title { font-size: 24px; font-weight: 800; fill: #ffffff; }
    .tagline { font-size: 12.5px; fill: #b8eadb; }
    .chip { font-size: 9.5px; font-weight: 600; fill: #c8ff7a; }
    .wave { fill: none; stroke: #2ee6a8; stroke-width: 2.5; stroke-linecap: round;
             animation: scroll 1.2s linear infinite; }
    @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-40px); } }
    .bar { fill: url(#barfill); transform-box: fill-box; transform-origin: 50% 100%;
            animation: bounce 1s ease-in-out infinite alternate; }
    @keyframes bounce { 0% { transform: scaleY(0.15); } 100% { transform: scaleY(1); } }
    @media (prefers-reduced-motion: reduce) { .wave, .bar { animation: none; } .bar { transform: scaleY(0.6); } }
  </style>

  <rect width="320" height="220" rx="16" fill="url(#bg)"/>
  <text x="24" y="34" class="font eyebrow">PILLAR 02</text>
  <text x="24" y="62" class="font title">Tutorials</text>
  <text x="24" y="82" class="font tagline">Build it from scratch to understand it</text>
  <text x="296" y="34" class="font chip" text-anchor="end">NumPy · tests · CI</text>

  <g clip-path="url(#waveclip)" mask="url(#wavemask)">
    <path class="wave" d="M-40 128 q10 -22 20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0"/>
  </g>

  <g>
    <rect class="bar" x="24" y="162" width="11" height="34" rx="2" style="animation-duration:0.9s;animation-delay:0.0s"/>
    <rect class="bar" x="41" y="162" width="11" height="34" rx="2" style="animation-duration:1.1s;animation-delay:-0.8s"/>
    <rect class="bar" x="58" y="162" width="11" height="34" rx="2" style="animation-duration:1.3s;animation-delay:-0.7s"/>
    <rect class="bar" x="75" y="162" width="11" height="34" rx="2" style="animation-duration:1.5s;animation-delay:-0.6s"/>
    <rect class="bar" x="92" y="162" width="11" height="34" rx="2" style="animation-duration:1.0s;animation-delay:-0.5s"/>
    <rect class="bar" x="109" y="162" width="11" height="34" rx="2" style="animation-duration:1.2s;animation-delay:-0.4s"/>
    <rect class="bar" x="126" y="162" width="11" height="34" rx="2" style="animation-duration:1.4s;animation-delay:-0.3s"/>
    <rect class="bar" x="143" y="162" width="11" height="34" rx="2" style="animation-duration:0.9s;animation-delay:-0.2s"/>
    <rect class="bar" x="160" y="162" width="11" height="34" rx="2" style="animation-duration:1.1s;animation-delay:-0.1s"/>
    <rect class="bar" x="177" y="162" width="11" height="34" rx="2" style="animation-duration:1.3s;animation-delay:0.0s"/>
    <rect class="bar" x="194" y="162" width="11" height="34" rx="2" style="animation-duration:1.5s;animation-delay:-0.8s"/>
    <rect class="bar" x="211" y="162" width="11" height="34" rx="2" style="animation-duration:1.0s;animation-delay:-0.7s"/>
    <rect class="bar" x="228" y="162" width="11" height="34" rx="2" style="animation-duration:1.2s;animation-delay:-0.6s"/>
    <rect class="bar" x="245" y="162" width="11" height="34" rx="2" style="animation-duration:1.4s;animation-delay:-0.5s"/>
    <rect class="bar" x="262" y="162" width="11" height="34" rx="2" style="animation-duration:0.9s;animation-delay:-0.4s"/>
    <rect class="bar" x="279" y="162" width="11" height="34" rx="2" style="animation-duration:1.1s;animation-delay:-0.3s"/>
  </g>
</svg>
