<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 250" width="320" height="250" role="img" aria-labelledby="title desc">
  <title id="title">Tutorials</title>
  <desc id="desc">Pillar 02, Tutorials: a laptop shows NumPy code and a moving waveform next to a pytest list where every check passes. Build it from scratch.</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f5d75"/></marker></defs>
  <style>
    .tag { font-family: 'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-weight: 500; letter-spacing: .08em; }
    .h { font-family: Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; font-weight: 600; fill: #2d3142; }
    .s { font-family: Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; fill: #4f5d75; }
    .c { font-family: 'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
    .serif { font-family: 'Instrument Serif',Georgia,'Times New Roman',serif; font-style: italic; fill: #4f5d75; }
    .flow { stroke-dasharray: 2 5; stroke-linecap: round; animation: flow .9s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -14; } }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    .bob { animation: bob 2.4s ease-in-out infinite; }
    @keyframes bob { 0%,100% { transform: translate(0,0); } 50% { transform: translate(0,-3px); } }
    .bar { transform-box: fill-box; transform-origin: 50% 100%; animation: bar .9s ease-in-out infinite; }
    @keyframes bar { 0%,100% { transform: scaleY(.35); } 50% { transform: scaleY(1); } }
    .blink { transform-box: fill-box; transform-origin: center; animation: blink 4s infinite; }
    @keyframes blink { 0%,93%,100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect x="1" y="1" width="318" height="248" rx="10" fill="#f7f3ec"/>
  <rect x="8" y="8" width="304" height="234" rx="8" fill="#f1f4ee" stroke="#4f6b45" stroke-width="1.4"/>
  <text x="22" y="32" class="tag" font-size="10.5" fill="#4f6b45">02 · TUTORIALS</text>
  
  <clipPath id="scr"><rect x="56" y="78" width="112" height="46"/></clipPath>
  <rect x="48" y="50" width="128" height="80" rx="5" fill="#2d3142"/>
  <rect x="56" y="58" width="112" height="66" rx="2" fill="#3a3f55"/>
  <text x="62" y="72" class="c" font-size="9" fill="#c9a24a">X = np.fft.rfft(x)</text>
  <g clip-path="url(#scr)"><path d="M70 104 q5 -11 10 0 q5 11 10 0 q5 -11 10 0 q5 11 10 0 q5 -11 10 0 q5 11 10 0 q5 -11 10 0 q5 11 10 0 q5 -11 10 0 q5 11 10 0 q5 -11 10 0 q5 11 10 0 q5 -11 10 0 q5 11 10 0 q5 -11 10 0 q5 11 10 0 q5 -11 10 0 q5 11 10 0" fill="none" stroke="#a9c49b" stroke-width="1.8" stroke-linecap="round">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-20 0" dur="1s" repeatCount="indefinite"/></path></g>
  <path d="M38 130 H186 L180 138 H44 Z" fill="#fff" stroke="#2d3142" stroke-width="1.3" stroke-linejoin="round"/>
  <rect x="210" y="48" width="66" height="84" rx="4" fill="#fff" stroke="#2d3142" stroke-width="1.3"/>
  <text x="243" y="64" class="tag" font-size="8" fill="#4f6b45" text-anchor="middle">PYTEST</text>
  <g stroke-linecap="round" stroke-linejoin="round">
    <path class="pulse" d="M218 79 l4 4 l7 -8" fill="none" stroke="#4f6b45" stroke-width="2"/><line x1="236" y1="79" x2="266" y2="79" stroke="#9aa3b5" stroke-width="1.6"/>
    <path class="pulse" style="animation-delay:-.8s" d="M218 97 l4 4 l7 -8" fill="none" stroke="#4f6b45" stroke-width="2"/><line x1="236" y1="97" x2="262" y2="97" stroke="#9aa3b5" stroke-width="1.6"/>
    <path class="pulse" style="animation-delay:-1.6s" d="M218 115 l4 4 l7 -8" fill="none" stroke="#4f6b45" stroke-width="2"/><line x1="236" y1="115" x2="266" y2="115" stroke="#9aa3b5" stroke-width="1.6"/>
  </g>
  <text x="22" y="178" class="h" font-size="18">Build it from scratch</text>
  <text x="22" y="198" class="s" font-size="11.5">NumPy first, then the library</text><text x="22" y="213" class="s" font-size="11.5">every lesson tested in CI</text>
  <rect x="20" y="222" width="82" height="16" rx="3" fill="#f3f1ec"/>
  <text x="26" y="233.5" class="c" font-size="10" fill="#2d3142">18 lessons</text>
  <g transform="translate(252 227)"><rect x="0" width="10" height="6" rx="1" fill="#4f6b45"/><rect x="12" width="10" height="6" rx="1" fill="#4f6b45"/><rect x="24" width="10" height="6" rx="1" fill="#4f6b45"/><rect x="36" width="10" height="6" rx="1" fill="#4f6b45"/></g>
</svg>
