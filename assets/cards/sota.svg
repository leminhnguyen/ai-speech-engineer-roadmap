<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220" role="img" aria-labelledby="title desc">
  <title id="title">SOTA Tracker</title>
  <desc id="desc">A radar sweeps in a circle and new blips light up, next to a list of tracked topics: speech LMs, full-duplex dialogue, neural codecs, and zero-shot TTS.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22123f"/>
      <stop offset="1" stop-color="#7b1f5c"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7ad9" stop-opacity="0"/>
      <stop offset="1" stop-color="#ff7ad9" stop-opacity="0.55"/>
    </linearGradient>
  </defs>
  <style>
    .font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .eyebrow { font-size: 10px; font-weight: 700; letter-spacing: 2px; fill: #ff7ad9; }
    .title { font-size: 24px; font-weight: 800; fill: #ffffff; }
    .tagline { font-size: 12.5px; fill: #f0c6e4; }
    .ring { fill: none; stroke: #ffffff2b; stroke-width: 1; }
    .sweep { animation: spin 4s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .blip { fill: #ffd1f1; transform-box: fill-box; transform-origin: center;
            animation: ping 4s ease-out infinite; opacity: 0; }
    .b2 { animation-delay: 1s; } .b3 { animation-delay: 2.2s; } .b4 { animation-delay: 3.1s; }
    @keyframes ping { 0% { opacity: 1; transform: scale(1.8); } 15% { transform: scale(1); } 70% { opacity: 0.25; } 100% { opacity: 0; } }
    .pill rect { fill: #ffffff1a; stroke: #ff7ad966; }
    .pill text { font-size: 10px; font-weight: 600; fill: #ffe3f6; }
    .pill { opacity: 0; animation: show 8s ease-out infinite; }
    .p2 { animation-delay: 0.6s; } .p3 { animation-delay: 1.2s; } .p4 { animation-delay: 1.8s; }
    @keyframes show { 0% { opacity: 0; transform: translateX(-8px); } 8%, 85% { opacity: 1; transform: translateX(0); } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .sweep, .blip, .pill { animation: none; }
      .blip, .pill { opacity: 1; }
    }
  </style>

  <rect width="320" height="220" rx="16" fill="url(#bg)"/>
  <text x="24" y="34" class="font eyebrow">PILLAR 03</text>
  <text x="24" y="62" class="font title">SOTA Tracker</text>
  <text x="24" y="82" class="font tagline">What's new, and why it matters</text>

  <g class="font">
    <g class="pill p1"><rect x="24" y="100" width="98" height="20" rx="10"/><text x="36" y="114">Speech LMs</text></g>
    <g class="pill p2"><rect x="24" y="126" width="98" height="20" rx="10"/><text x="36" y="140">Full-duplex</text></g>
    <g class="pill p3"><rect x="24" y="152" width="98" height="20" rx="10"/><text x="36" y="166">Neural codecs</text></g>
    <g class="pill p4"><rect x="24" y="178" width="98" height="20" rx="10"/><text x="36" y="192">Zero-shot TTS</text></g>
  </g>

  <g transform="translate(228 146)">
    <circle class="ring" r="22"/>
    <circle class="ring" r="44"/>
    <circle class="ring" r="64"/>
    <line class="ring" x1="-64" y1="0" x2="64" y2="0"/>
    <line class="ring" x1="0" y1="-64" x2="0" y2="64"/>
    <g class="sweep">
      <path d="M0 0 L64 0 A64 64 0 0 0 49 -41 Z" fill="url(#beam)"/>
      <line x1="0" y1="0" x2="64" y2="0" stroke="#ff7ad9" stroke-width="1.5"/>
    </g>
    <circle class="blip b1" cx="36" cy="22" r="3.5"/>
    <circle class="blip b2" cx="-18" cy="40" r="3.5"/>
    <circle class="blip b3" cx="-40" cy="-20" r="3.5"/>
    <circle class="blip b4" cx="14" cy="-48" r="3.5"/>
    <circle r="3" fill="#ff7ad9"/>
  </g>
</svg>
