<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="aicc-map-title aicc-map-desc">
  <title id="aicc-map-title">Where each AICC lesson acts on a phone call</title>
  <desc id="aicc-map-desc">Course map for Module 04: caller audio crosses the phone network (lessons 01 and 03), LiveKit SIP and the room (lesson 02), the audio front-end for noise and echo (lessons 04 and 05) and turn-taking with VAD, endpointing and barge-in (lessons 06 to 08) before reaching the STT, LLM and TTS agent, whose speech returns to the caller; lesson 09 budgets the latency of that loop and lesson 10 covers transfers, keypad input, outbound calls and operations.</desc>
  <defs>
    <marker id="map-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="map-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
    <symbol id="map-ico-mobile" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 5a2 2 0 0 1 2 -2h8a2 2 0 0 1 2 2v14a2 2 0 0 1 -2 2h-8a2 2 0 0 1 -2 -2v-14"/><path d="M11 4h2"/><path d="M12 17v.01"/></symbol>
    <symbol id="map-ico-handset" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5l-2.5 1.5a11 11 0 0 0 5 5l1.5 -2.5l5 2v4a2 2 0 0 1 -2 2a16 16 0 0 1 -15 -15a2 2 0 0 1 2 -2"/></symbol>
    <symbol id="map-ico-server" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a3 3 0 0 1 3 -3h12a3 3 0 0 1 3 3v2a3 3 0 0 1 -3 3h-12a3 3 0 0 1 -3 -3"/><path d="M3 15a3 3 0 0 1 3 -3h12a3 3 0 0 1 3 3v2a3 3 0 0 1 -3 3h-12a3 3 0 0 1 -3 -3l0 -2"/><path d="M7 8l0 .01"/><path d="M7 16l0 .01"/></symbol>
    <symbol id="map-ico-wave" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h2"/><path d="M7 8v8"/><path d="M11 5v14"/><path d="M15 9v6"/><path d="M19 11v2"/><path d="M21 12h0"/></symbol>
    <symbol id="map-ico-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5a3 3 0 0 1 6 0v5a3 3 0 0 1 -6 0z"/><path d="M5 10a7 7 0 0 0 14 0"/><path d="M8 21h8"/><path d="M12 17v4"/></symbol>
    <symbol id="map-ico-robot" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6a2 2 0 0 1 2 -2h8a2 2 0 0 1 2 2v4a2 2 0 0 1 -2 2h-8a2 2 0 0 1 -2 -2l0 -4"/><path d="M12 2v2"/><path d="M9 12v9"/><path d="M15 12v9"/><path d="M5 16l4 -2"/><path d="M15 14l4 2"/><path d="M9 18h6"/><path d="M10 8v.01"/><path d="M14 8v.01"/></symbol>
    <symbol id="map-ico-headset" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14v-3a8 8 0 1 1 16 0v3"/><path d="M18 19c0 1.657 -2.686 3 -6 3"/><path d="M4 14a2 2 0 0 1 2 -2h1a2 2 0 0 1 2 2v3a2 2 0 0 1 -2 2h-1a2 2 0 0 1 -2 -2v-3"/><path d="M15 14a2 2 0 0 1 2 -2h1a2 2 0 0 1 2 2v3a2 2 0 0 1 -2 2h-1a2 2 0 0 1 -2 -2v-3"/></symbol>
    <symbol id="map-ico-chart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19l16 0"/><path d="M4 15l4 -6l4 2l4 -5l4 4"/></symbol>
  </defs>
  <rect width="1000" height="560" fill="#f5f5f5"/>

  <text x="36" y="36" fill="#bf4520" font-size="9" font-weight="500" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" letter-spacing="0.16em">MODULE 04 · AI CONTACT CENTER WITH LIVEKIT</text>
  <text x="36" y="66" fill="#2d3142" font-size="24" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif">Where each lesson acts on a phone call</text>
  <text x="36" y="132" fill="#5a6580" font-size="7.5" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" letter-spacing="0.16em">CALLER AUDIO →</text>

  <!-- forward path -->
  <g stroke="#4f5d75" stroke-width="1.2" fill="none">
    <line x1="164" y1="184" x2="196" y2="184" marker-end="url(#map-arrow)"/>
    <line x1="324" y1="184" x2="356" y2="184" marker-end="url(#map-arrow)"/>
    <line x1="484" y1="184" x2="516" y2="184" marker-end="url(#map-arrow)"/>
    <line x1="644" y1="184" x2="676" y2="184" marker-end="url(#map-arrow)"/>
  </g>
  <line x1="804" y1="184" x2="836" y2="184" stroke="#bf4520" stroke-width="1.4" marker-end="url(#map-arrow-accent)"/>
  <!-- return path: agent speech back to the caller -->
  <path d="M 900 220 V 288 Q 900 296 892 296 H 108 Q 100 296 100 288 V 224" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#map-arrow)"/>
  <rect x="424" y="276" width="152" height="12" rx="2" fill="#f5f5f5"/>
  <text x="500" y="285" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">AGENT SPEECH · L08 STOPS IT</text>

  <!-- latency dimension line -->
  <g stroke="#4f5d75" stroke-width="1">
    <line x1="676" y1="344" x2="964" y2="344"/>
    <line x1="676" y1="336" x2="676" y2="352"/>
    <line x1="964" y1="336" x2="964" y2="352"/>
  </g>
  <rect x="680" y="320" width="280" height="14" rx="2" fill="#f5f5f5"/>
  <text x="820" y="330" fill="#2d3142" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">L09 · END OF SPEECH → FIRST AUDIO &lt; 1 S</text>
  <text x="36" y="348" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif">Every stage on the way in costs audio quality; every stage on the way back costs time.</text>

  <!-- nodes -->
  <g font-family="'Geist', 'Inter', 'Helvetica Neue', Arial, sans-serif">
    <rect x="36" y="152" width="128" height="68" rx="6" fill="#f5f5f5"/>
    <rect x="36" y="152" width="128" height="68" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
    <rect x="44" y="158" width="32" height="12" rx="2" fill="none" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
    <text x="60" y="167" fill="#5a6580" font-size="7" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">USER</text>
    <use href="#map-ico-mobile" x="142" y="157" width="16" height="16" color="#5a6580"/>
    <text x="100" y="192" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Caller</text>
    <text x="100" y="206" fill="#4f5d75" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">8 kHz handset</text>

    <rect x="196" y="152" width="128" height="68" rx="6" fill="#f5f5f5"/>
    <rect x="196" y="152" width="128" height="68" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
    <rect x="204" y="158" width="28" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
    <text x="218" y="167" fill="#5a6580" font-size="7" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
    <use href="#map-ico-handset" x="302" y="157" width="16" height="16" color="#5a6580"/>
    <text x="260" y="192" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Phone network</text>
    <text x="260" y="206" fill="#4f5d75" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">sip · rtp · g.711</text>

    <rect x="356" y="152" width="128" height="68" rx="6" fill="#f5f5f5"/>
    <rect x="356" y="152" width="128" height="68" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <rect x="364" y="158" width="28" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
    <text x="378" y="167" fill="#2d3142" font-size="7" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">SIP</text>
    <use href="#map-ico-server" x="462" y="157" width="16" height="16" color="#5a6580"/>
    <text x="420" y="192" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">LiveKit room</text>
    <text x="420" y="206" fill="#4f5d75" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">sip participant</text>

    <rect x="516" y="152" width="128" height="68" rx="6" fill="#f5f5f5"/>
    <rect x="516" y="152" width="128" height="68" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <rect x="524" y="158" width="28" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
    <text x="538" y="167" fill="#2d3142" font-size="7" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">DSP</text>
    <use href="#map-ico-wave" x="622" y="157" width="16" height="16" color="#5a6580"/>
    <text x="580" y="192" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Audio front-end</text>
    <text x="580" y="206" fill="#4f5d75" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">noise · echo</text>

    <rect x="676" y="152" width="128" height="68" rx="6" fill="#f5f5f5"/>
    <rect x="676" y="152" width="128" height="68" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
    <rect x="684" y="158" width="36" height="12" rx="2" fill="none" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
    <text x="702" y="167" fill="#bf4520" font-size="7" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">TURN</text>
    <use href="#map-ico-mic" x="782" y="157" width="16" height="16" color="#bf4520"/>
    <text x="740" y="192" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Turn-taking</text>
    <text x="740" y="206" fill="#4f5d75" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">vad · eou · barge-in</text>

    <rect x="836" y="152" width="128" height="68" rx="6" fill="#f5f5f5"/>
    <rect x="836" y="152" width="128" height="68" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <rect x="844" y="158" width="40" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
    <text x="864" y="167" fill="#2d3142" font-size="7" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">AGENT</text>
    <use href="#map-ico-robot" x="942" y="157" width="16" height="16" color="#5a6580"/>
    <text x="900" y="192" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Voice agent</text>
    <text x="900" y="206" fill="#4f5d75" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">stt · llm · tts</text>
  </g>

  <!-- lesson badges under the nodes they act on -->
  <g font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="8" text-anchor="middle" letter-spacing="0.04em" fill="#2d3142">
    <rect x="228" y="236" width="28" height="14" rx="2" fill="rgba(45,49,66,0.08)"/><text x="242" y="246">L01</text>
    <rect x="264" y="236" width="28" height="14" rx="2" fill="rgba(45,49,66,0.08)"/><text x="278" y="246">L03</text>
    <rect x="406" y="236" width="28" height="14" rx="2" fill="rgba(45,49,66,0.08)"/><text x="420" y="246">L02</text>
    <rect x="548" y="236" width="28" height="14" rx="2" fill="rgba(45,49,66,0.08)"/><text x="562" y="246">L04</text>
    <rect x="584" y="236" width="28" height="14" rx="2" fill="rgba(45,49,66,0.08)"/><text x="598" y="246">L05</text>
    <rect x="690" y="236" width="28" height="14" rx="2" fill="rgba(191,69,32,0.12)"/><text x="704" y="246">L06</text>
    <rect x="726" y="236" width="28" height="14" rx="2" fill="rgba(191,69,32,0.12)"/><text x="740" y="246">L07</text>
    <rect x="762" y="236" width="28" height="14" rx="2" fill="rgba(191,69,32,0.12)"/><text x="776" y="246">L08</text>
  </g>

  <!-- operations lane -->
  <rect x="36" y="384" width="928" height="96" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="48" y="378" width="176" height="12" rx="2" fill="#f5f5f5"/>
  <text x="54" y="387" fill="#5a6580" font-size="7.5" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" letter-spacing="0.14em">L10 · RUNNING IT IN PRODUCTION</text>
  <g font-family="'Geist', 'Inter', 'Helvetica Neue', Arial, sans-serif">
    <rect x="60" y="404" width="208" height="56" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
    <use href="#map-ico-headset" x="72" y="416" width="16" height="16" color="#5a6580"/>
    <text x="96" y="428" fill="#2d3142" font-size="12" font-weight="600">Human hand-off</text>
    <text x="96" y="444" fill="#4f5d75" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace">warm · cold transfer</text>
    <rect x="284" y="404" width="208" height="56" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
    <use href="#map-ico-handset" x="296" y="416" width="16" height="16" color="#5a6580"/>
    <text x="320" y="428" fill="#2d3142" font-size="12" font-weight="600">Keypad and IVR</text>
    <text x="320" y="444" fill="#4f5d75" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace">dtmf · pin entry</text>
    <rect x="508" y="404" width="208" height="56" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
    <use href="#map-ico-mobile" x="520" y="416" width="16" height="16" color="#5a6580"/>
    <text x="544" y="428" fill="#2d3142" font-size="12" font-weight="600">Outbound calls</text>
    <text x="544" y="444" fill="#4f5d75" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace">answer · voicemail</text>
    <rect x="732" y="404" width="208" height="56" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
    <use href="#map-ico-chart" x="744" y="416" width="16" height="16" color="#5a6580"/>
    <text x="768" y="428" fill="#2d3142" font-size="12" font-weight="600">KPIs and capacity</text>
    <text x="768" y="444" fill="#4f5d75" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace">containment · erlang c</text>
  </g>

  <!-- legend -->
  <line x1="36" y1="508" x2="964" y2="508" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <g font-family="'Geist', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="9" fill="#4f5d75">
    <text x="36" y="532" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="8" letter-spacing="0.18em">LEGEND</text>
    <line x1="108" y1="529" x2="132" y2="529" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#map-arrow)"/>
    <text x="140" y="532">Caller audio</text>
    <line x1="228" y1="529" x2="252" y2="529" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#map-arrow)"/>
    <text x="260" y="532">Agent speech</text>
    <line x1="352" y1="529" x2="376" y2="529" stroke="#bf4520" stroke-width="1.4" marker-end="url(#map-arrow-accent)"/>
    <text x="384" y="532">A committed user turn</text>
    <rect x="504" y="522" width="28" height="14" rx="2" fill="rgba(45,49,66,0.08)"/>
    <text x="518" y="532" fill="#2d3142" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">L04</text>
    <text x="540" y="532">Lesson that works on this stage</text>
  </g>
</svg>
