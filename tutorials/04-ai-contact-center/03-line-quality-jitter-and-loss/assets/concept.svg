<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" role="img" aria-labelledby="line-quality-title line-quality-desc">
  <title id="line-quality-title">Where call audio degrades on its way to the agent</title>
  <desc id="line-quality-desc">Pipeline from the caller's handset through the carrier network, a jitter buffer and a decoder with packet loss concealment to the agent's VAD and STT, listing the impairment introduced at each stage and the countermeasure that limits it.</desc>
  <defs>
    <marker id="line-quality-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="line-quality-arrow-bi" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="line-quality-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
    <marker id="line-quality-arrow-accent-bi" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
    <marker id="line-quality-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
    <marker id="line-quality-arrow-link-bi" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
    <symbol id="line-quality-ico-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 18 0a9 9 0 0 0 -18 0"/><path d="M12 7v5l3 3"/></symbol>
    <symbol id="line-quality-ico-mobile" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 5a2 2 0 0 1 2 -2h8a2 2 0 0 1 2 2v14a2 2 0 0 1 -2 2h-8a2 2 0 0 1 -2 -2v-14"/><path d="M11 4h2"/><path d="M12 17v.01"/></symbol>
    <symbol id="line-quality-ico-robot" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6a2 2 0 0 1 2 -2h8a2 2 0 0 1 2 2v4a2 2 0 0 1 -2 2h-8a2 2 0 0 1 -2 -2l0 -4"/><path d="M12 2v2"/><path d="M9 12v9"/><path d="M15 12v9"/><path d="M5 16l4 -2"/><path d="M15 14l4 2"/><path d="M9 18h6"/><path d="M10 8v.01"/><path d="M14 8v.01"/></symbol>
    <symbol id="line-quality-ico-wave" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h2"/><path d="M7 8v8"/><path d="M11 5v14"/><path d="M15 9v6"/><path d="M19 11v2"/></symbol>
    <symbol id="line-quality-ico-wifi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 18l.01 0"/><path d="M9.172 15.172a4 4 0 0 1 5.656 0"/><path d="M6.343 12.343a8 8 0 0 1 11.314 0"/><path d="M3.515 9.515c4.686 -4.687 12.284 -4.687 17 0"/></symbol>
  </defs>
  <rect width="1000" height="480" fill="#f5f5f5"/>
  <path d="M 184,156 H 232" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#line-quality-arrow)"/>
  <path d="M 376,156 H 424" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#line-quality-arrow-accent)"/>
  <path d="M 568,156 H 616" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#line-quality-arrow)"/>
  <path d="M 760,156 H 808" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#line-quality-arrow)"/>
  <rect x="188.0" y="136" width="40" height="12" rx="2" fill="#f5f5f5"/><text x="208.0" y="145" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">VOICE</text>
  <rect x="386.0" y="136" width="28" height="12" rx="2" fill="#f5f5f5"/><text x="400.0" y="145" fill="#bf4520" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">RTP</text>
  <rect x="570.0" y="136" width="44" height="12" rx="2" fill="#f5f5f5"/><text x="592.0" y="145" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">FRAMES</text>
  <rect x="770.0" y="136" width="28" height="12" rx="2" fill="#f5f5f5"/><text x="784.0" y="145" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">PCM</text>
  <rect x="40" y="128" width="144" height="56" rx="6" fill="#f5f5f5"/><rect x="40" y="128" width="144" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/><rect x="48" y="134" width="32" height="12" rx="2" fill="none" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/><text x="64.0" y="143" fill="#5a6580" font-size="7" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">USER</text><use href="#line-quality-ico-mobile" x="162" y="133" width="16" height="16" color="#5a6580"/><text x="112.0" y="162" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Inter', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">Caller handset</text><text x="112.0" y="176" fill="#4f5d75" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">mic · codec</text>
  <rect x="232" y="128" width="144" height="56" rx="6" fill="#f5f5f5"/><rect x="232" y="128" width="144" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><rect x="240" y="134" width="27" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/><text x="253.5" y="143" fill="#5a6580" font-size="7" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">NET</text><use href="#line-quality-ico-wifi" x="354" y="133" width="16" height="16" color="#5a6580"/><text x="304.0" y="162" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Inter', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">Carrier network</text><text x="304.0" y="176" fill="#4f5d75" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">radio · IP · SBC</text>
  <rect x="424" y="128" width="144" height="56" rx="6" fill="#f5f5f5"/><rect x="424" y="128" width="144" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/><rect x="432" y="134" width="42" height="12" rx="2" fill="none" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/><text x="453.0" y="143" fill="#bf4520" font-size="7" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">BUFFER</text><use href="#line-quality-ico-clock" x="546" y="133" width="16" height="16" color="#bf4520"/><text x="496.0" y="162" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Inter', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">Jitter buffer</text><text x="496.0" y="176" fill="#4f5d75" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">playout deadline</text>
  <rect x="616" y="128" width="144" height="56" rx="6" fill="#f5f5f5"/><rect x="616" y="128" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="624" y="134" width="42" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/><text x="645.0" y="143" fill="#2d3142" font-size="7" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">DECODE</text><use href="#line-quality-ico-wave" x="738" y="133" width="16" height="16" color="#5a6580"/><text x="688.0" y="162" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Inter', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">Decoder + PLC</text><text x="688.0" y="176" fill="#4f5d75" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">G.711 to PCM</text>
  <rect x="808" y="128" width="144" height="56" rx="6" fill="#f5f5f5"/><rect x="808" y="128" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="816" y="134" width="37" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/><text x="834.5" y="143" fill="#2d3142" font-size="7" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">AGENT</text><use href="#line-quality-ico-robot" x="930" y="133" width="16" height="16" color="#5a6580"/><text x="880.0" y="162" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Inter', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">Agent input</text><text x="880.0" y="176" fill="#4f5d75" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">VAD · STT</text>
  <text x="40" y="236" fill="#5a6580" font-size="7" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="start" letter-spacing="0.16em">WHAT GOES WRONG</text>
  <text x="40" y="324" fill="#5a6580" font-size="7" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" text-anchor="start" letter-spacing="0.16em">WHAT LIMITS IT</text>
  <rect x="40" y="244" width="144" height="48" rx="6" fill="#f5f5f5"/><rect x="40" y="244" width="144" height="48" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/><text x="112.0" y="265.0" fill="#4f5d75" font-size="10" font-family="'Geist', 'Inter', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">Clipping, too quiet,</text><text x="112.0" y="278.0" fill="#4f5d75" font-size="10" font-family="'Geist', 'Inter', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">background noise</text>
  <rect x="40" y="332" width="144" height="48" rx="6" fill="#f5f5f5"/><rect x="40" y="332" width="144" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/><text x="112.0" y="353.0" fill="#2d3142" font-size="10" font-family="'Geist', 'Inter', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">AGC; noise</text><text x="112.0" y="366.0" fill="#2d3142" font-size="10" font-family="'Geist', 'Inter', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">cancellation (lesson 04)</text>
  <rect x="232" y="244" width="144" height="48" rx="6" fill="#f5f5f5"/><rect x="232" y="244" width="144" height="48" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/><text x="304.0" y="265.0" fill="#4f5d75" font-size="10" font-family="'Geist', 'Inter', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">Loss in bursts,</text><text x="304.0" y="278.0" fill="#4f5d75" font-size="10" font-family="'Geist', 'Inter', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">jitter, reordering</text>
  <rect x="232" y="332" width="144" height="48" rx="6" fill="#f5f5f5"/><rect x="232" y="332" width="144" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/><text x="304.0" y="353.0" fill="#2d3142" font-size="10" font-family="'Geist', 'Inter', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">Region pinning,</text><text x="304.0" y="366.0" fill="#2d3142" font-size="10" font-family="'Geist', 'Inter', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">a better trunk</text>
  <rect x="424" y="244" width="144" height="48" rx="6" fill="#f5f5f5"/><rect x="424" y="244" width="144" height="48" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/><text x="496.0" y="265.0" fill="#4f5d75" font-size="10" font-family="'Geist', 'Inter', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">Late counts as lost;</text><text x="496.0" y="278.0" fill="#4f5d75" font-size="10" font-family="'Geist', 'Inter', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">the buffer adds delay</text>
  <rect x="424" y="332" width="144" height="48" rx="6" fill="#f5f5f5"/><rect x="424" y="332" width="144" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/><text x="496.0" y="353.0" fill="#2d3142" font-size="10" font-family="'Geist', 'Inter', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">Adaptive playout</text><text x="496.0" y="366.0" fill="#2d3142" font-size="10" font-family="'Geist', 'Inter', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">delay</text>
  <rect x="616" y="244" width="144" height="48" rx="6" fill="#f5f5f5"/><rect x="616" y="244" width="144" height="48" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/><text x="688.0" y="265.0" fill="#4f5d75" font-size="10" font-family="'Geist', 'Inter', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">Gaps and clicks</text><text x="688.0" y="278.0" fill="#4f5d75" font-size="10" font-family="'Geist', 'Inter', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">in the waveform</text>
  <rect x="616" y="332" width="144" height="48" rx="6" fill="#f5f5f5"/><rect x="616" y="332" width="144" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/><text x="688.0" y="353.0" fill="#2d3142" font-size="10" font-family="'Geist', 'Inter', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">Pitch-period</text><text x="688.0" y="366.0" fill="#2d3142" font-size="10" font-family="'Geist', 'Inter', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">concealment</text>
  <rect x="808" y="244" width="144" height="48" rx="6" fill="#f5f5f5"/><rect x="808" y="244" width="144" height="48" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/><text x="880.0" y="265.0" fill="#4f5d75" font-size="10" font-family="'Geist', 'Inter', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">Higher WER,</text><text x="880.0" y="278.0" fill="#4f5d75" font-size="10" font-family="'Geist', 'Inter', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">false VAD triggers</text>
  <rect x="808" y="332" width="144" height="48" rx="6" fill="#f5f5f5"/><rect x="808" y="332" width="144" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/><text x="880.0" y="353.0" fill="#2d3142" font-size="10" font-family="'Geist', 'Inter', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">Measure: loss, jitter,</text><text x="880.0" y="366.0" fill="#2d3142" font-size="10" font-family="'Geist', 'Inter', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">MOS per call</text>
  <text x="40" y="36" fill="#bf4520" font-size="9" font-weight="500" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" letter-spacing="0.16em">MODULE 04 · LESSON 03</text><text x="40" y="66" fill="#2d3142" font-size="24" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif">Every hop can damage the audio. Most damage is invisible in SIP.</text>
  <line x1="40" y1="408" x2="960" y2="408" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/><text x="40" y="432" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" letter-spacing="0.18em">LEGEND</text><rect x="112" y="424" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/><text x="132" y="432" fill="#4f5d75" font-size="9" font-family="'Geist', 'Inter', 'Helvetica Neue', Arial, sans-serif">Where delay trades against loss</text><rect x="327.4" y="424" width="14" height="10" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="3,2"/><text x="347.4" y="432" fill="#4f5d75" font-size="9" font-family="'Geist', 'Inter', 'Helvetica Neue', Arial, sans-serif">Impairment</text><rect x="429.4" y="424" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/><text x="449.4" y="432" fill="#4f5d75" font-size="9" font-family="'Geist', 'Inter', 'Helvetica Neue', Arial, sans-serif">Countermeasure</text><line x1="553.0" y1="429" x2="577.0" y2="429" stroke="#bf4520" stroke-width="1.2" marker-end="url(#line-quality-arrow-accent)"/><text x="585.0" y="432" fill="#4f5d75" font-size="9" font-family="'Geist', 'Inter', 'Helvetica Neue', Arial, sans-serif">Unreliable hop: UDP over the carrier network</text>
</svg>
