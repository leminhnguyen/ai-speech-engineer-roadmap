<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" role="img" aria-labelledby="lk-arch-title lk-arch-desc">
  <title id="lk-arch-title">From phone call to AgentSession on LiveKit</title>
  <desc id="lk-arch-desc">Architecture of a LiveKit telephony call: the caller reaches LiveKit SIP through a carrier trunk, joins a room as a SIP participant, a dispatch rule starts a job on the agent server, and the AgentSession exchanges room audio with the caller while streaming to model providers and calling business APIs.</desc>
