  <text x="672" y="280" fill="#4f5d75" font-size="14" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" text-anchor="start" font-style="italic">Noise suppression assumes the noise</text>
  <text x="672" y="298" fill="#4f5d75" font-size="14" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" text-anchor="start" font-style="italic">is not speech. A colleague talking</text>
  <text x="672" y="316" fill="#4f5d75" font-size="14" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" text-anchor="start" font-style="italic">behind the caller needs voice isolation.</text>
