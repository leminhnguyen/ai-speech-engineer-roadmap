<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 432" width="1000" height="432" role="img" aria-labelledby="ns-pipeline-title ns-pipeline-desc">
  <title id="ns-pipeline-title">A spectral noise suppressor</title>
  <desc id="ns-pipeline-desc">Pipeline of a single-channel noise suppressor: noisy audio is framed and transformed with an STFT, a minimum-statistics tracker estimates the noise spectrum, a Wiener gain rule with a decision-directed SNR estimate and a gain floor computes a gain per time-frequency bin, the gain is applied and the inverse STFT produces enhanced audio for VAD and STT.</desc>
  <defs>
    <marker id="ns-pipeline-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="ns-pipeline-arrow-bi" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="ns-pipeline-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
    <marker id="ns-pipeline-arrow-accent-bi" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
    <marker id="ns-pipeline-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
    <marker id="ns-pipeline-arrow-link-bi" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
