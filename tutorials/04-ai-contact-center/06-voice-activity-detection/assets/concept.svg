<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 552" width="1000" height="552" role="img" aria-labelledby="vad-fsm-title vad-fsm-desc">
  <title id="vad-fsm-title">The VAD state machine behind START and END events</title>
  <desc id="vad-fsm-desc">State machine of a Silero-style voice activity detector: from Silence, a probability at or above 0.50 moves to Maybe speech; 50 ms of speech frames confirm Speech and emit START_OF_SPEECH, while a dip below 0.50 returns to Silence; from Speech, a probability below 0.35 moves to Maybe silence, which returns to Speech if the probability recovers or emits END_OF_SPEECH after 550 ms of silence.</desc>
  <defs>
    <marker id="vad-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="vad-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
  </defs>
  <rect width="1000" height="552" fill="#f5f5f5"/>

  <!-- heading -->
  <text x="40" y="36" fill="#bf4520" font-size="9" font-weight="500" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" letter-spacing="0.16em">MODULE 04 · LESSON 06</text>
  <text x="40" y="66" fill="#2d3142" font-size="24" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif">Two thresholds and two timers turn a noisy probability into events.</text>

  <!-- transitions (drawn before states) -->
  <circle cx="64" cy="144" r="6" fill="#2d3142"/>
  <line x1="70" y1="144" x2="116" y2="144" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#vad-arrow)"/>
  <line x1="320" y1="132" x2="636" y2="132" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#vad-arrow)"/>
  <line x1="640" y1="156" x2="324" y2="156" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#vad-arrow)"/>
  <line x1="740" y1="176" x2="740" y2="332" stroke="#bf4520" stroke-width="1.4" marker-end="url(#vad-arrow-accent)"/>
  <line x1="640" y1="356" x2="324" y2="356" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#vad-arrow)"/>
  <line x1="320" y1="380" x2="636" y2="380" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#vad-arrow)"/>
  <line x1="220" y1="336" x2="220" y2="180" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#vad-arrow)"/>

  <!-- transition labels: guard or timer, masked, 8px from the stroke -->
  <g font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="8" text-anchor="middle" letter-spacing="0.06em">
    <rect x="452" y="112" width="56" height="12" rx="2" fill="#f5f5f5"/>
    <text x="480" y="121" fill="#4f5d75">p ≥ 0.50</text>
    <rect x="452" y="164" width="56" height="12" rx="2" fill="#f5f5f5"/>
    <text x="480" y="173" fill="#4f5d75">p &lt; 0.50</text>
    <rect x="748" y="248" width="80" height="12" rx="2" fill="#f5f5f5"/>
    <text x="788" y="257" fill="#bf4520">50 MS · START</text>
    <rect x="452" y="336" width="56" height="12" rx="2" fill="#f5f5f5"/>
    <text x="480" y="345" fill="#4f5d75">p &lt; 0.35</text>
    <rect x="452" y="388" width="56" height="12" rx="2" fill="#f5f5f5"/>
    <text x="480" y="397" fill="#4f5d75">p ≥ 0.35</text>
    <rect x="136" y="248" width="76" height="12" rx="2" fill="#f5f5f5"/>
    <text x="174" y="257" fill="#4f5d75">550 MS · END</text>
  </g>

  <!-- states -->
  <g font-family="'Geist', 'Inter', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">
    <rect x="120" y="112" width="200" height="64" rx="8" fill="#f5f5f5"/>
    <rect x="120" y="112" width="200" height="64" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="220" y="140" fill="#2d3142" font-size="12" font-weight="600">Silence</text>
    <text x="220" y="156" fill="#4f5d75" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace">waiting for activation</text>

    <rect x="640" y="112" width="200" height="64" rx="8" fill="#f5f5f5"/>
    <rect x="640" y="112" width="200" height="64" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="740" y="140" fill="#2d3142" font-size="12" font-weight="600">Maybe speech</text>
    <text x="740" y="156" fill="#4f5d75" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace">counting speech frames</text>

    <rect x="640" y="336" width="200" height="64" rx="8" fill="#f5f5f5"/>
    <rect x="640" y="336" width="200" height="64" rx="8" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
    <text x="740" y="364" fill="#2d3142" font-size="12" font-weight="600">Speech</text>
    <text x="740" y="380" fill="#4f5d75" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace">the caller is talking</text>

    <rect x="120" y="336" width="200" height="64" rx="8" fill="#f5f5f5"/>
    <rect x="120" y="336" width="200" height="64" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="220" y="364" fill="#2d3142" font-size="12" font-weight="600">Maybe silence</text>
    <text x="220" y="380" fill="#4f5d75" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace">hangover: counting silence</text>
  </g>

  <!-- editorial callouts -->
  <g font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-size="14" font-style="italic" fill="#4f5d75" text-anchor="middle">
    <text x="500" y="444">START_OF_SPEECH is decided 50 ms after the onset, but its chunk begins 500 ms earlier (prefix padding).</text>
    <text x="500" y="464">END_OF_SPEECH is decided 550 ms after the caller stops: the first slice of every reply's latency.</text>
  </g>

  <!-- legend strip -->
  <line x1="40" y1="488" x2="960" y2="488" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <g font-family="'Geist', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="9" fill="#4f5d75">
    <text x="40" y="512" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="8" letter-spacing="0.18em">LEGEND</text>
    <circle cx="118" cy="509" r="4" fill="#2d3142"/>
    <text x="128" y="512">Start</text>
    <line x1="176" y1="509" x2="200" y2="509" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#vad-arrow)"/>
    <text x="208" y="512">Transition: probability guard or timer</text>
    <line x1="400" y1="509" x2="424" y2="509" stroke="#bf4520" stroke-width="1.4" marker-end="url(#vad-arrow-accent)"/>
    <text x="432" y="512">Emits START_OF_SPEECH</text>
    <rect x="560" y="504" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
    <text x="580" y="512">State that downstream sees as speech</text>
    <text x="40" y="536" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="8.5" fill="#5a6580">silero.VAD.load(activation_threshold=0.5, deactivation_threshold=0.35, min_speech_duration=0.05, min_silence_duration=0.55, prefix_padding_duration=0.5)</text>
  </g>
</svg>
